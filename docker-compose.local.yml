# 本地构建版 直接使用仓库里的 linux.dockerfile
# 用法: docker compose -f docker-compose.local.yml up -d --build

services:
  devbox:
    build:
      context: .
      dockerfile: linux.dockerfile
    image: devbox-linux:local
    container_name: devbox
    restart: unless-stopped
    ports:
      # SSH
      - "22222:22222"
      # PI Web
      - "10001:10001"
      # EasyTier P2P 监听 需与配置文件里的 listeners 保持一致
      - "10010:10010/tcp"
      - "10010:10010/udp"
    volumes:
      # /root 含全部缓存与配置 bind 到宿主机 Linux 原生文件系统无额外开销
      - ./data/root:/root
      # 代码目录
      - ./workspace:/workspace
    environment:
      PI_WEB_PASSWORD: devbox-pi-web
      GIT_USER_NAME: git
      GIT_USER_EMAIL: git@git.com
      # pi-web 端口 默认 10001 需与上方 ports "10001:10001" 映射保持一致
      # PI_WEB_PORT: "10001"
      # 额外信任的 Host 名 逗号分隔 精确匹配 域名/反代访问公网时必须声明 否则 next 拒绝请求(Untrusted request)
      # 例: 通过 https://devbox.example.com 访问时填 PI_WEB_ALLOWED_HOSTS: devbox.example.com
      # PI_WEB_ALLOWED_HOSTS: devbox.example.com
      # 容器启动时自动运行 pi-web (devbox pi-web restart 幂等) 默认不自动
      # PI_WEB_AUTO_RUN: "true"
      # 容器启动时自动运行 easytier (devbox easytier restart 幂等) 默认不自动
      # 需先自行编写 /root/easytier/config/config.toml 否则只告警不启动
      # EASYTIER_AUTO_RUN: "true"
      # SSH 私钥 多行值用块语法 按需取消注释
      # SSH_PRIVATE_KEY: |
      #   -----BEGIN OPENSSH PRIVATE KEY-----
      #   ...
      # SSH authorized_keys 公钥 按需取消注释
      # SSH_PUBLIC_KEY: ssh-ed25519 AAAA...
      # root 密码 设了才开 SSH 密码登录 不设则仅密钥登录
      # ROOT_PASSWORD: change-me
      # SSH 端口 默认 22222
      # SSH_PORT: "22222"
